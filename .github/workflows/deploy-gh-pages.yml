name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: main-repo
        run: pnpm install --no-frozen-lockfile

      - name: Build HP
        working-directory: main-repo
        run: pnpm run build
        continue-on-error: true

      - name: Prepare dist/hunter
        run: mkdir -p main-repo/dist/hunter

      - name: Copy LP to dist
        run: cp -r main-repo/lp/. main-repo/dist/hunter/

      - name: Prepare dist/ricca
        run: mkdir -p main-repo/dist/ricca

      - name: Copy Ricca LP to dist
        run: cp -r main-repo/ricca-lp/. main-repo/dist/ricca/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./main-repo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
