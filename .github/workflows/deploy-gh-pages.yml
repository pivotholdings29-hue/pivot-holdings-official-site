name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout hunter-stable branch
        uses: actions/checkout@v4
        with:
          ref: hunter-stable
          path: hunter-stable-repo

      - name: Restore LP files from hunter-stable
        run: |
          STABLE_DIR="hunter-stable-repo/client/public/hunter"
          MAIN_DIR="main-repo/client/public/hunter"
          cp "$STABLE_DIR/index.html" "$MAIN_DIR/index.html"
          cp "$STABLE_DIR/style.css" "$MAIN_DIR/style.css"
          cp "$STABLE_DIR/main.js" "$MAIN_DIR/main.js"
          for pdf in "$STABLE_DIR"/*.pdf; do
            [ -f "$pdf" ] && cp "$pdf" "$MAIN_DIR/"
          done
          cp -r "$STABLE_DIR/assets/." "$MAIN_DIR/assets/"
          echo "✅ LP files restored from hunter-stable branch"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        working-directory: main-repo
        run: pnpm install --no-frozen-lockfile

      - name: Build
        working-directory: main-repo
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./main-repo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
